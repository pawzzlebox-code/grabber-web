<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid #1a1a1a;
    }
    .header svg { color: #0ea5e9; }
    .header h1 { font-size: 14px; font-weight: 600; }
    .content { padding: 16px; }
    .url-box {
      background: #1a1a1a;
      border: 1px solid #262626;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      word-break: break-all;
      font-size: 11px;
      color: #999;
      max-height: 48px;
      overflow: hidden;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #0ea5e9;
      color: #fff;
    }
    .btn-primary:hover { background: #0284c7; }
    .btn-primary:disabled { background: #262626; color: #666; cursor: not-allowed; }
    .status {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      text-align: center;
    }
    .status.success { background: #0ea5e910; color: #0ea5e9; }
    .status.error { background: #ef444410; color: #ef4444; }
    .settings {
      padding: 12px 16px;
      border-top: 1px solid #1a1a1a;
    }
    .settings label {
      display: block;
      font-size: 11px;
      color: #666;
      margin-bottom: 4px;
    }
    .settings input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #262626;
      border-radius: 8px;
      padding: 8px 10px;
      color: #fff;
      font-size: 12px;
      outline: none;
    }
    .settings input:focus { border-color: #0ea5e9; }
    .not-video {
      text-align: center;
      color: #666;
      padding: 20px 0;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    <h1>Grabber</h1>
  </div>

  <div class="content">
    <div id="video-section">
      <div class="url-box" id="url-display"></div>
      <button class="btn btn-primary" id="grab-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download
      </button>
      <div id="status" class="status" style="display:none"></div>
    </div>
    <div id="no-video" class="not-video" style="display:none">
      Not a video page.<br>Navigate to a video and try again.
    </div>
  </div>

  <div class="settings">
    <label>Grabber server URL</label>
    <input type="url" id="server-url" placeholder="http://localhost:3000" />
  </div>

  <script src="popup.js"></script>
</body>
</html>
